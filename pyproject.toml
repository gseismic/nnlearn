[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nnlearn"
version = "0.1.0"
description = "Independent tensor and autograd framework with a PyTorch-style API"
requires-python = ">=3.8"
authors = [
    { name = "Liu Shengli", email = "liushengli203@163.com" },
]
dependencies = ["numpy", "loguru"]

[project.optional-dependencies]
test = ["pytest>=8.3.5,<8.4"]
test-reference = ["pytest>=8.3.5,<8.4", "torch==2.6.0; python_version >= '3.9'"]
dev = ["pytest>=8.3.5,<8.4", "ruff>=0.11.13,<0.12"]

[project.urls]
Homepage = "https://github.com/pai-studio/nnlearn"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["nnlearn", "nnlearn.*", "torch_protocol"]
namespaces = false
