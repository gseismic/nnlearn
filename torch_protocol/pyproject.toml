[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-protocol"
version = "0.1.0"
description = "Backend-neutral structural protocols for PyTorch-style tensor training APIs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools]
packages = ["torch_protocol"]
package-dir = { torch_protocol = "." }
